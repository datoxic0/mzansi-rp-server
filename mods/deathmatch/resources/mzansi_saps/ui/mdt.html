<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SAPS Mobile Data Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #080d1a;
            color: #d8e2f0;
            width: 800px;
            height: 560px;
            overflow: hidden;
            user-select: none;
        }
        .mdt-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            border: 2px solid #1a3a6b;
            box-shadow: 0 0 25px rgba(0, 100, 255, 0.2);
            background: linear-gradient(180deg, #0b1528 0%, #060a14 100%);
        }
        .mdt-header {
            background: #0c1c36;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #204b8c;
        }
        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background: #f1c40f;
            color: #000;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .close-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .close-btn:hover { background: #c0392b; }
        .mdt-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 200px;
            background: rgba(10, 20, 40, 0.6);
            border-right: 1px solid #1a3a6b;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-item {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            color: #8da4c4;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background: #1b3d73;
            color: #fff;
            border-left: 3px solid #f1c40f;
        }
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 14px;
            background: #091222;
            border: 1px solid #234d8a;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        .search-box button {
            padding: 10px 20px;
            background: #1f618d;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .search-box button:hover { background: #2980b9; }
        .card {
            background: rgba(13, 27, 51, 0.7);
            border: 1px solid #1a3a6b;
            border-radius: 8px;
            padding: 16px;
        }
        .card-header {
            font-size: 14px;
            font-weight: 700;
            color: #f1c40f;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .record-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            font-size: 13px;
        }
        .record-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .label { color: #6e8db7; font-size: 11px; text-transform: uppercase; }
        .val { color: #fff; font-weight: 600; }
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-action {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-fine { background: #e67e22; color: #fff; }
        .btn-arrest { background: #c0392b; color: #fff; }
        .btn-warrant { background: #8e44ad; color: #fff; }
    </style>
</head>
<body>
    <div class="mdt-container">
        <div class="mdt-header">
            <div class="logo-title">
                <span class="badge">SAPS MDT</span>
                <span class="title">South African Police Service — National Crime Information Terminal</span>
            </div>
            <button class="close-btn" onclick="closeMDT()">ESC / CLOSE</button>
        </div>
        <div class="mdt-body">
            <div class="sidebar">
                <div class="nav-item active" onclick="setTab('search')">Citizen Database</div>
                <div class="nav-item" onclick="setTab('vehicles')">Vehicle Registration</div>
                <div class="nav-item" onclick="setTab('warrants')">Active Warrants</div>
                <div class="nav-item" onclick="setTab('dispatch')">Live 10111 Dispatch</div>
            </div>
            <div class="content" id="mainContent">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Enter citizen name, surname, or ID..." onkeypress="if(event.key==='Enter') executeSearch()">
                    <button onclick="executeSearch()">SEARCH DATABASE</button>
                </div>

                <div class="card" id="profileCard">
                    <div class="card-header">
                        <span>CITIZEN RECORD</span>
                        <span id="wantedBadge" style="color: #2ecc71;">NO ACTIVE WARRANTS</span>
                    </div>
                    <div class="record-grid">
                        <div class="record-item">
                            <span class="label">Full Name</span>
                            <span class="val" id="recName">Search citizen above</span>
                        </div>
                        <div class="record-item">
                            <span class="label">Citizen ID</span>
                            <span class="val" id="recId">—</span>
                        </div>
                        <div class="record-item">
                            <span class="label">Occupation</span>
                            <span class="val" id="recJob">—</span>
                        </div>
                        <div class="record-item">
                            <span class="label">Driver License</span>
                            <span class="val" id="recLicense">VALID</span>
                        </div>
                    </div>

                    <div class="action-row">
                        <button class="btn-action btn-fine" onclick="actionTicket()">Issue R500 Fine</button>
                        <button class="btn-action btn-arrest" onclick="actionArrest()">File Arrest Warrant</button>
                        <button class="btn-action btn-warrant" onclick="actionWanted()">Mark Wanted Level</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function closeMDT() {
            if (window.mta) {
                mta.triggerEvent("mzansi:saps:closeMDT");
            }
        }

        function executeSearch() {
            var q = document.getElementById('searchInput').value;
            if (q && q.trim().length > 0 && window.mta) {
                mta.triggerEvent("mzansi:saps:mdtSearch", q);
            }
        }

        function setProfile(data) {
            if (!data) return;
            document.getElementById('recName').textContent = (data.first_name || "") + " " + (data.last_name || "");
            document.getElementById('recId').textContent = "#" + (data.id || "0");
            document.getElementById('recJob').textContent = data.jobName || "Civilian";
        }

        function actionTicket() { alert("Fine issued via SAPS Penal Code."); }
        function actionArrest() { alert("Arrest warrant filed with Station Commander."); }
        function actionWanted() { alert("Wanted status broadcast to sector patrol units."); }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'profile') {
                setProfile(event.data.record);
            }
        });
    </script>
</body>
</html>
