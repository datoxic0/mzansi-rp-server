<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mzansi RP - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1f3c 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            width: 380px;
            padding: 40px;
            background: rgba(10, 22, 40, 0.95);
            border-radius: 16px;
            border: 1px solid rgba(200, 170, 50, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(200, 170, 50, 0.1);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 28px;
            color: #c8aa32;
            text-shadow: 0 0 20px rgba(200, 170, 50, 0.3);
            letter-spacing: 2px;
        }
        .logo p {
            font-size: 12px;
            color: #8899aa;
            margin-top: 5px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            color: #8899aa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #c8aa32;
            background: rgba(200, 170, 50, 0.05);
            box-shadow: 0 0 15px rgba(200, 170, 50, 0.1);
        }
        .form-group input::placeholder {
            color: #556677;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #c8aa32, #a89028);
            color: #0a1628;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #dab840, #c8aa32);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(200, 170, 50, 0.3);
        }
        .btn-secondary {
            background: transparent;
            color: #8899aa;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }
        .btn-secondary:hover {
            color: #c8aa32;
            border-color: #c8aa32;
        }
        .error {
            color: #ff4444;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #556677;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>MZANSI</h1>
            <p>South African Roleplay</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
            <button type="button" class="btn btn-secondary" onclick="showRegister()">Create Account</button>
            <div class="error" id="error"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            if (!username || !password) {
                showError('Please fill in all fields.');
                return;
            }
            mta.triggerEvent('mzansi:accounts:login', username, password);
        });

        function showRegister() {
            mta.triggerEvent('mzansi:accounts:showRegistration');
        }

        function showError(msg) {
            var el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'loginError') {
                showError(event.data.message);
            }
        });
    </script>
</body>
</html>
