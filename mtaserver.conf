# Mzansi RP Server Configuration
# South African Roleplay Server

# Server Settings
server_name Mzansi RP
server_port 22003
maxplayers 128

# HTTP Settings
http_enabled 1
http_port 8080
http_dereferrer 0
http_aiomethod 1

# Performance Settings
_max_fps 60
gravity 0.008
game_speed 1
weather 0
time 12 0

# Resource Auto-Start
# Core systems start first
start mzansi_core
start mzansi_utils
start mzansi_anticheat

# UI systems
start mzansi_hud

# Game systems
start mzansi_vehicles
start mzansi_inventory
start mzansi_phone
start mzansi_housing

# Jobs
start mzansi_jobs

# Factions
start mzansi_saps
start mzansi_ems

# Criminal Systems
start mzansi_gangs
start mzansi_crime
start mzansi_drugs
start mzansi_illegalmarket

# Maps
start mzansi_maps
